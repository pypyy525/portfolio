name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble website
        run: python3 assemble.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 10
          done
          echo "Pages artifact is not available yet"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment

